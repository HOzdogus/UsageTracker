# Builds the apps on GitHub's servers every time code is pushed.
# Pushes to main publish the APKs on the repo's Releases page so you can
# download and install them straight from your phone. Pushes to other
# branches just check the build and attach the APKs to the workflow run.
name: Build APK

on:
  push:
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APKs
        run: gradle :app:assembleDebug :backlog:assembleDebug --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ScreenTime-${{ github.run_number }}.apk
          cp backlog/build/outputs/apk/debug/backlog-debug.apk Backlog-${{ github.run_number }}.apk

      - name: Attach APKs to this run
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.run_number }}
          path: "*.apk"

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Download an .apk below on your phone and tap it to install. Screen Time and Backlog are separate apps.
          files: |
            ScreenTime-${{ github.run_number }}.apk
            Backlog-${{ github.run_number }}.apk
